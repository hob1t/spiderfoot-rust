[package]
name = "spiderfoot-rust"
version = "0.1.1"
edition = "2021"

[dependencies]
governor = { version = "0.10.4", features = ["std", "jitter"] }
dashmap = "6.2.1"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }   # assuming you'll use this for HTTP
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
hickory-resolver = "0.24.4"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
serde_json = "1.0.150"
scraper = { version = "0.27.0", default-features = false }
url = "2.5.8"
urlencoding = "2.1.3"
regex = "1.12.3"
addr = "0.15.6"
ipnet = "2.11.0"

[dev-dependencies]
wiremock = "0.6.5"