[package]
name = "spiderfoot-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
governor = { version = "0.10.4", features = ["std", "jitter"] }
dashmap = "6.1.0"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }   # assuming you'll use this for HTTP
tokio = { version = "1.49.0", features = ["full"] }
clap = { version = "4.5.57", features = ["derive"] }
anyhow = "1.0.101"
hickory-resolver = "0.24.2"
nonzero_ext = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
serde_json = "1.0.140"
urlencoding = "2.1.3"
tracing = "0.1.41"
regex = "1.12.3"
addr = "0.15.6"

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.49.0", features = ["full"] }
